<html lang="ja">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@600;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20560%20450'%3E%3Cg%20fill='%23B92613'%3E%3Cpath%20transform='translate(165,235)%20rotate(8)'%20d='M0,-190%20C22,-126%2022,126%200,190%20C-22,126%20-22,-126%200,-190%20Z'/%3E%3Cpath%20transform='translate(245,235)%20rotate(8)'%20d='M0,-190%20C22,-126%2022,126%200,190%20C-22,126%20-22,-126%200,-190%20Z'/%3E%3Cpath%20transform='translate(325,235)%20rotate(8)'%20d='M0,-190%20C22,-126%2022,126%200,190%20C-22,126%20-22,-126%200,-190%20Z'/%3E%3Cpath%20transform='translate(405,235)%20rotate(8)'%20d='M0,-190%20C22,-126%2022,126%200,190%20C-22,126%20-22,-126%200,-190%20Z'/%3E%3Cpath%20transform='translate(280,180)%20rotate(-4)'%20d='M-248,0%20C-160,-27%20160,-27%20248,0%20C160,27%20-160,27%20-248,0%20Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* 5garashi.com設計事務所 公式パレット / official palette (Art. 4, Art. 9-4) */
  :root {
    --paper: #F9EFCB;
    --head: #FFE699;
    --ink: #385723;
    --steel: #7B4A21;
    --volt: #B92613;
    --volt-deep: #8C1B0D;
    --card: #FFFDF2;
    --line: #DFCF9A;
    --ok: #3E6B2A;
    --cream: #FFF3D6;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    font-weight: 600;
  }
  /* ユニバーサルデザイン標準装備 / universal design as standard (Art. 7, Art. 9-4) */
  :focus-visible { outline: 3px solid var(--volt); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  #map { position: absolute; inset: 0; }

  /* ブランド表示 / brand header (Art. 9-1)。マークは volt 固定・変形しない */
  .brand {
    display: flex; align-items: center; gap: 10px;
    margin: -8px -10px 8px; padding: 6px 10px;
    background: var(--head); border-bottom: 3px solid var(--ink);
    border-radius: 3px 3px 0 0;
  }
  .brand .mark { width: 30px; height: 24px; flex: 0 0 auto; margin: 4px; }  /* 最小16px以上・四方に間(ま) */
  .brand .lang { min-height: 44px; min-width: 64px; padding: 0 10px; font-size: 0.8125rem; background: var(--card); }
  .brand-title { font-weight: 800; font-size: 0.875rem; letter-spacing: .03em; color: var(--ink); }

  /* 操作パネル / control panel */
  .panel {
    position: absolute; z-index: 1000;
    left: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    width: min(23rem, calc(100% - 20px));
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 8px 10px 6px;
    font-size: 0.875rem;
    line-height: 1.65;
  }
  .panel.collapsed { width: auto; }
  .panel.collapsed .brand { margin-bottom: 6px; }
  .panel.collapsed .body,
  .panel.collapsed .opts,
  .panel.collapsed .controls { display: none; }

  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .row > * { flex-shrink: 0; }
  .time {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-weight: 800; font-size: 1rem; color: var(--volt-deep); white-space: nowrap;
  }
  .kind {
    font-size: 0.75rem; font-weight: 800; letter-spacing: .03em;
    padding: 1px 8px; border-radius: 3px;
    color: var(--cream); background: var(--ink);
  }
  .kind.future { background: var(--volt-deep); }
  .spacer { flex: 1; }

  /* 操作の3原則(1) 押しやすく:44×44px以上 / tap targets 44px (Art. 7-3) */
  button {
    font: inherit; font-weight: 800; color: var(--ink); background: var(--card);
    border: 2px solid var(--line); border-radius: 4px;
    min-width: 44px; min-height: 44px; padding: 0 10px; cursor: pointer;
    transition: background-color .15s, border-color .15s;
  }
  button:hover { border-color: var(--ink); }
  button[aria-pressed="true"] { background: var(--head); border-color: var(--ink); }
  .controls { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .controls button { flex: 0 0 auto; }

  /* 時刻の帯 / timeline */
  .timeline { margin: 8px 0 2px; }
  .track { display: flex; gap: 2px; height: 10px; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
  .track span { flex: 1; background: var(--line); cursor: pointer; }
  .track span.past { background: var(--ink); }
  /* 実況と予報は色だけで区別しない:予報は斜線 / forecast is hatched, not color-only (Art. 7-2) */
  .track span.future {
    background: repeating-linear-gradient(45deg, var(--ink) 0 2px, var(--card) 2px 4px);
  }
  .track span.now { box-shadow: inset 0 0 0 2px var(--volt); }
  .track span.active { box-shadow: inset 0 0 0 2px var(--volt-deep), inset 0 0 0 4px var(--cream); }
  input[type=range] { width: 100%; margin: 0; height: 44px; accent-color: var(--ink); }

  .meta { font-size: 0.75rem; color: var(--steel); letter-spacing: .06em; display: flex; flex-wrap: wrap; gap: 0 10px; }
  .meta .err { color: var(--volt-deep); font-weight: 800; flex-basis: 100%; }
  .meta .err:empty { display: none; }
  .en { color: var(--steel); font-weight: 600; }

  /* 設定 / settings */
  .opts {
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px 10px;
    border-top: 2px solid var(--line); margin-top: 8px; padding-top: 8px;
  }
  .opts[hidden] { display: none; }
  .opts label { font-size: 0.8125rem; }

  .opts .wide { grid-column: 1 / -1; }
  .opts .actions { grid-column: 1 / -1; display: flex; gap: 8px; }
  .opts .actions button { flex: 1; }
  .opts .check { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .opts .check input { width: 24px; height: 24px; accent-color: var(--ink); }
  select {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--card);
    border: 2px solid var(--line); border-radius: 4px; padding: 8px; min-height: 44px; width: 100%;
  }
  .credit { grid-column: 1 / -1; font-size: 0.75rem; color: var(--steel); }
  .credit a { color: var(--ink); }

  /* 凡例 / legend。色は気象庁の配色を用いる(機能色) / JMA functional colors */
  .legend {
    position: absolute; z-index: 1000;
    right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
    background: var(--card); border: 2px solid var(--ink); border-radius: 6px;
    padding: 8px 10px; font-size: 0.75rem; line-height: 1.6; color: var(--ink);
  }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .legend i { width: 16px; height: 12px; display: inline-block; border: 1px solid var(--steel); }
  .legend .unit { color: var(--steel); font-weight: 800; letter-spacing: .06em; margin-bottom: 4px; display: block; }
  .legend a { color: var(--ink); }

  /* 天気図ダイアログ / weather chart dialog */
  /* 地図の上に浮かぶ窓:移動・大きさ変更ができる / floating, movable, resizable window */
  dialog#chart {
    position: fixed; z-index: 1100; margin: 0; inset: auto;
    left: 60px; top: calc(10px + env(safe-area-inset-top, 0px));
    width: min(440px, calc(100% - 20px)); min-width: 260px;
    max-width: calc(100vw - 20px); max-height: calc(100vh - 20px);
    overflow: auto; resize: both;
    padding: 8px 10px 10px; border: 2px solid var(--ink); border-radius: 6px;
    background: var(--card); color: var(--ink); font-size: 0.875rem;
    box-shadow: 0 4px 16px rgba(56, 87, 35, 0.3);
  }
  dialog#chart .brand { justify-content: space-between; cursor: move; touch-action: none; user-select: none; }
  dialog#chart .brand:focus-visible { outline-offset: -3px; }
  dialog#chart.dragging { opacity: 0.9; }
  .drag-hint { font-size: 0.75rem; color: var(--steel); font-weight: 600; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chart-nav { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .chart-caption {
    flex: 1; text-align: center; font-weight: 800;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; color: var(--volt-deep);
  }
  .chart-img { border: 1px solid var(--line); background: #fff; text-align: center; overflow: auto; }
  .chart-img img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  button:disabled { opacity: .45; cursor: default; }
  .controls { flex-wrap: wrap; }

  /* 等圧線の高・低 / high and low markers。色だけに頼らず文字で示す */
  .hl { background: none; border: none; }
  .hl div {
    transform: translate(-50%, -50%); display: inline-flex; flex-direction: column; align-items: center;
    font-weight: 800; line-height: 1.1; text-shadow: 0 0 3px #FFF3D6, 0 0 3px #FFF3D6;
    white-space: nowrap;
  }
  .hl b { font-size: 1.25rem; }
  .hl span { font-size: 0.75rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .hl.high div { color: var(--ink); }
  .hl.low div { color: var(--volt-deep); }
  /* 現在位置 / my position。色だけでなく文字でも示す(第7条7-2) */
  .me { background: none; border: none; }
  .me div {
    transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px;
    font-weight: 800; font-size: 0.75rem; white-space: nowrap; color: var(--volt-deep);
    text-shadow: 0 0 3px #FFF3D6, 0 0 3px #FFF3D6, 0 0 3px #FFF3D6;
  }
  .me i {
    flex: 0 0 auto; width: 14px; height: 14px; border-radius: 50%;
    background: var(--volt); border: 3px solid var(--cream); box-sizing: content-box;
    box-shadow: 0 0 0 1px var(--volt-deep);
  }
  .legend .iso { display: block; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 4px; }
  .legend .iso > div { display: flex; align-items: center; gap: 8px; }
  .legend .iso i { height: 0; border: 0; border-top: 2px solid var(--ink); }
  .legend .iso i.thin { border-top-width: 1px; }

  .leaflet-container { font-family: inherit; }
  .leaflet-control-zoom a { color: var(--ink); }

  @media (max-width: 520px) {
    /* 本文14px・注記12pxの下限は守る / keep the 14px body and 12px note minimums (Art. 6) */
    .panel { padding: 6px 8px 4px; }
    .legend { padding: 6px 8px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<!-- 天気図(気象庁の画像をそのまま表示) / JMA weather chart shown as published -->
<dialog id="chart" aria-labelledby="chart-title">
  <div class="brand" id="chart-handle" tabindex="0"
       data-ja-title="ドラッグで移動（矢印キーでも動かせます）" data-en-title="Drag to move (arrow keys also work)"
       title="ドラッグで移動（矢印キーでも動かせます）">
    <span class="brand-title" id="chart-title" data-ja="天気図" data-en="Weather chart">天気図</span>
    <span class="drag-hint" aria-hidden="true" data-ja="⇕ 移動" data-en="⇕ Move">⇕ 移動</span>
    <span class="spacer"></span>
    <button id="chart-close" data-ja="閉じる" data-en="Close">閉じる</button>
  </div>
  <div class="tabs" role="group" data-ja-label="種類" data-en-label="Chart type" aria-label="種類">
    <button data-kind="now" aria-pressed="true" data-ja="実況" data-en="Analysis">実況</button>
    <button data-kind="ft24" aria-pressed="false" data-ja="24時間予想" data-en="24h forecast">24時間予想</button>
    <button data-kind="ft48" aria-pressed="false" data-ja="48時間予想" data-en="48h forecast">48時間予想</button>
  </div>
  <div class="tabs" role="group" data-ja-label="範囲" data-en-label="Area" aria-label="範囲">
    <button data-area="near" aria-pressed="true" data-ja="日本周辺" data-en="Around Japan">日本周辺</button>
    <button data-area="asia" aria-pressed="false" data-ja="アジア" data-en="Asia">アジア</button>
  </div>
  <div class="chart-nav">
    <button id="chart-prev" data-ja="前の図" data-en="Earlier">前の図</button>
    <span id="chart-caption" class="chart-caption" aria-live="polite"></span>
    <button id="chart-next" data-ja="次の図" data-en="Later">次の図</button>
  </div>
  <div class="chart-img"><img id="chart-img" alt=""></div>
  <p class="credit">
    <span id="chart-updated"></span>　
    <span data-ja="出典：気象庁" data-en="Source: Japan Meteorological Agency">出典：気象庁</span>　
    <a href="https://www.jma.go.jp/bosai/weather_map/" target="_blank" rel="noopener"
       data-ja="気象庁の天気図ページ" data-en="JMA weather chart page">気象庁の天気図ページ</a>
  </p>
</dialog>

<div class="legend" id="legend" aria-label="降水強度の凡例"></div>

<!-- シンボルマーク(シンプル版) / Symbol mark, simple version — 公式SVG原本のまま / official SVG, unmodified -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="tally5" viewBox="0 0 560 450">
    <g fill="var(--mark,#B92613)">
      <path transform="translate(165,235) rotate(8)" d="M0,-190 C22,-126 22,126 0,190 C-22,126 -22,-126 0,-190 Z"/>
      <path transform="translate(245,235) rotate(8)" d="M0,-190 C22,-126 22,126 0,190 C-22,126 -22,-126 0,-190 Z"/>
      <path transform="translate(325,235) rotate(8)" d="M0,-190 C22,-126 22,126 0,190 C-22,126 -22,-126 0,-190 Z"/>
      <path transform="translate(405,235) rotate(8)" d="M0,-190 C22,-126 22,126 0,190 C-22,126 -22,-126 0,-190 Z"/>
      <path transform="translate(280,180) rotate(-4)" d="M-248,0 C-160,-27 160,-27 248,0 C160,27 -160,27 -248,0 Z"/>
    </g>
  </symbol>
</svg>

<div class="panel" id="panel" role="region" aria-label="表示の操作 / Display controls">
  <div class="brand">
    <svg class="mark" viewBox="0 0 560 450" role="img" aria-label="5garashi.com設計事務所シンボルマーク / 5garashi.com Design Office symbol mark"><use href="#tally5"/></svg>
    <span class="brand-title" data-ja="雨雲レーダー 自動更新" data-en="Rain Radar — Auto-refresh">雨雲レーダー 自動更新</span>
    <span class="spacer"></span>
    <button id="lang" class="lang" data-ja="English" data-en="日本語"
            data-ja-title="Switch to English" data-en-title="日本語に切り替える"
            title="Switch to English">English</button>
  </div>

  <div class="row">
    <button id="collapse" aria-expanded="true" data-ja-title="たたむ / 広げる" data-en-title="Collapse / expand">▼</button>
    <span class="time" id="time">読み込み中</span>
    <span class="kind" id="kind">実況</span>
    <span class="spacer"></span>
    <button id="live" aria-pressed="true" data-ja="現在" data-en="Now"
            data-ja-title="最新の実況で止めて自動で追従" data-en-title="Stay on the latest observation">現在</button>
    <button id="settings" aria-pressed="false" aria-controls="opts" data-ja="設定" data-en="Settings"
            data-ja-title="設定" data-en-title="Settings">設定</button>
  </div>

  <div class="body">
    <div class="timeline">
      <div class="track" id="track"></div>
      <input type="range" id="slider" min="0" max="0" value="0"
             data-ja-label="表示時刻" data-en-label="Displayed time" aria-label="表示時刻">
    </div>
    <div class="meta">
      <span id="layername">雨雲の動き</span>
      <span id="updated"></span>
      <span id="countdown"></span>
      <span id="error" class="err"></span>
      <span id="tileerr" class="err"></span>
      <span id="isoinfo"></span>
      <span id="geoinfo"></span>
    </div>
  </div>

  <div class="controls">
    <button id="prev" data-ja="前" data-en="Back" data-ja-title="前のコマ" data-en-title="Previous frame">前</button>
    <button id="play" data-ja-title="再生" data-en-title="Play">再生</button>
    <button id="next" data-ja="次" data-en="Next" data-ja-title="次のコマ" data-en-title="Next frame">次</button>
    <span class="spacer"></span>
    <button id="geo" aria-pressed="false" data-ja="現在地" data-en="Location"
            data-ja-title="現在位置を地図に表示する" data-en-title="Show my position on the map">現在地</button>
    <button id="isobar" aria-pressed="true" data-ja="等圧線" data-en="Isobars"
            data-ja-title="等圧線を地図に重ねる" data-en-title="Overlay isobars on the map">等圧線</button>
    <button id="chartbtn" aria-haspopup="dialog" data-ja="天気図" data-en="Chart"
            data-ja-title="気象庁の天気図を開く" data-en-title="Open the JMA weather chart">天気図</button>
  </div>

  <div class="opts" id="opts" hidden>
    <label class="wide" for="layer" data-ja="表示するデータ" data-en="Data">表示するデータ</label>
    <select id="layer" class="wide">
      <optgroup data-ja-label="ナウキャスト" data-en-label="Nowcast" label="ナウキャスト">
        <option value="raincloud" selected data-ja="雨雲の動き" data-en="Rain">雨雲の動き</option>
        <option value="thunder" data-ja="雷活動度" data-en="Lightning">雷活動度</option>
        <option value="tornado" data-ja="竜巻発生確度" data-en="Tornado">竜巻発生確度</option>
      </optgroup>
      <optgroup data-ja-label="ひまわり" data-en-label="Himawari satellite" label="ひまわり">
        <option value="sat-ir" data-ja="赤外画像" data-en="Infrared">赤外画像</option>
        <option value="sat-vis" data-ja="可視画像" data-en="Visible">可視画像</option>
        <option value="sat-truecolor" data-ja="トゥルーカラー" data-en="True color">トゥルーカラー</option>
      </optgroup>
      <optgroup data-ja-label="今後の雨" data-en-label="Rainfall forecast" label="今後の雨">
        <option value="rain1h" data-ja="1時間降水量" data-en="1-hour rainfall">1時間降水量</option>
        <option value="rain3h" data-ja="3時間降水量" data-en="3-hour rainfall">3時間降水量</option>
        <option value="rain24h" data-ja="24時間降水量" data-en="24-hour rainfall">24時間降水量</option>
      </optgroup>
      <optgroup data-ja-label="天気予報分布" data-en-label="Distribution forecast" label="天気予報分布">
        <option value="weather" data-ja="天気" data-en="Weather">天気</option>
        <option value="temp" data-ja="気温" data-en="Temperature">気温</option>
        <option value="r3" data-ja="3時間降水量" data-en="Rainfall, 3 hours">3時間降水量</option>
        <option value="s3" data-ja="3時間降雪量" data-en="Snowfall, 3 hours">3時間降雪量</option>
        <option value="max-temp" data-ja="日中の最高気温" data-en="Daytime high">日中の最高気温</option>
        <option value="min-temp" data-ja="朝の最低気温" data-en="Morning low">朝の最低気温</option>
      </optgroup>
      <optgroup data-ja-label="雪" data-en-label="Snow" label="雪">
        <option value="snowd" data-ja="積雪の深さ" data-en="Snow depth">積雪の深さ</option>
        <option value="snow24h" data-ja="24時間降雪量" data-en="Snowfall, 24 hours">24時間降雪量</option>
      </optgroup>
      <optgroup data-ja-label="危険度分布（キキクル）" data-en-label="Kikikuru risk map" label="危険度分布（キキクル）">
        <option value="land" data-ja="土砂災害" data-en="Landslide">土砂災害</option>
        <option value="inund" data-ja="浸水害" data-en="Inundation">浸水害</option>
      </optgroup>

</div>

(() => {

    thunder: { unit: { ja: "雷活動度", en: "Lightning activity" }, items: [
      ["活動度4", "Level 4", "#c800ff"], ["活動度3", "Level 3", "#ff2800"],
      ["活動度2", "Level 2", "#ffaa00"], ["活動度1", "Level 1", "#faf500"]] },
    tornado: { unit: { ja: "竜巻発生確度", en: "Tornado likelihood" }, approx: true, items: [
      ["発生確度2", "Level 2", "#ff2800"], ["発生確度1", "Level 1", "#faf500"]] },
    weather: { unit: { ja: "天気", en: "Weather" }, items: [

      ["5〜9", "5–9", "#218cff"], ["1〜4", "1–4", "#a0d2ff"]] },

  };

  // ---------- 日英の文言 / bilingual strings (Art. 1, Art. 8-6) ----------
  const TEXT = {
    loading:   { ja: "読み込み中", en: "Loading" },

    geoAcc:    { ja: m => `現在地 誤差±${m}m`, en: m => `Position, accuracy ±${m} m` },
    geoWait:   { ja: "現在地を測定しています", en: "Getting your position…" },
    geoDenied: { ja: "位置情報が許可されていません。ブラウザの許可設定を確認してください",

    geoFail:   { ja: "位置情報を取得できませんでした。ブラウザの許可設定を確認してください",
                 en: "Could not get your location. Check the browser's permission setting." },
    obsTip:    { ja: "実況", en: "observed" },
    isoLabel:  { ja: "等圧線", en: "Isobars" },
    isoEvery:  { ja: "4hPaごと", en: "every 4 hPa" },
    isoThick:  { ja: "太線は20hPaごと", en: "thick line every 20 hPa" },
    isoSrc:    { ja: "海面気圧：Open-Meteo（数値予報）", en: "Sea-level pressure: Open-Meteo (model)" },
    isoFail:   { ja: "等圧線のデータを取得できませんでした", en: "Could not load the isobar data." },
    high:      { ja: "高", en: "H" },
    low:       { ja: "低", en: "L" },
    chartNone: { ja: "天気図を取得できませんでした", en: "Could not load the weather chart." },
    chartNow:  { ja: d => `${d} 実況`, en: d => `Analysis ${d}` },
    chartFt:   { ja: (d, h) => `${d} の予想（${h}時間後）`, en: (d, h) => `Forecast for ${d} (+${h}h)` },
    chartAlt:  { ja: (a, c) => `天気図（${a}、${c}）`, en: (a, c) => `Weather chart (${a}, ${c})` },
    areaNear:  { ja: "日本周辺", en: "around Japan" },
    areaAsia:  { ja: "アジア", en: "Asia" },
    fcTip:     { ja: "予報", en: "forecast" }
  };
  let lang = "ja";
  const T = key => { const v = TEXT[key]; return v[lang]; };

  // ---------- 地図 ----------
  const map = L.map("map", { zoomControl: true, minZoom: 4, maxZoom: 13 })
    .setView([35.68, 139.77], 8);

  L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>',
    maxZoom: 18
  }).addTo(map);

  // ---------- 状態 ----------
  let frames = [];      // {label: Date, future: bool, layer}
  let current = 0;
  let playing = false;
  let follow = true;    // 現在時刻（最新の実況）で止めて自動で追従する
  let playTimer = null;
  let refreshTimer = null;
  let countdownTimer = null;
  let nextRefreshAt = 0;
  let opacity = 0.75;

  const $ = id => document.getElementById(id);
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
  const locale = () => (lang === "ja" ? "ja-JP" : "en-GB");
  const fmt = d => d.toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo" });
  const fmtDate = d => d.toLocaleString(locale(), { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo" });

  // "20260921053000"(UTC) → Date
  const parseJmaTime = s => new Date(Date.UTC(
    +s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), +s.slice(8, 10), +s.slice(10, 12)
  ));

  // ---------- 気象庁の各データの場所 ----------
  // 画像は偶数ズームにしか中身が入っていないため、使うズームは偶数に絞っている
  const JMA = "https://www.jma.go.jp/bosai/";
  const NOWC = { dir: "jmatile/data/nowc", times: ["targetTimes_N3.json"], zooms: [4, 6, 8, 10] };
  const RASRF = { dir: "jmatile/data/rasrf", times: ["targetTimes.json"], zooms: [4, 6, 8, 10] };
  const WDIST = { dir: "jmatile/data/wdist", times: ["targetTimes.json"], zooms: [4, 6, 8, 10] };
  const SNOW = { dir: "jmatile/data/snow", times: ["targetTimes.json"], zooms: [4, 6, 8, 10] };
  const RISK = { dir: "jmatile/data/risk", times: ["targetTimes.json"], zooms: [4, 6, 8, 10] };
  const SAT = { dir: "himawari/data/satimg", times: ["targetTimes_jp.json"], zooms: [4, 6], member: "jp", ext: "jpg" };

  const LAYERS = {
    raincloud: { ...NOWC, name: "雨雲の動き", en: "Rain (high-resolution nowcast)", path: "surf/hrpns", element: "hrpns",
                 times: ["targetTimes_N1.json", "targetTimes_N2.json"], legend: "rain", page: "nowc" },
    thunder:   { ...NOWC, name: "雷活動度", en: "Lightning activity", path: "surf/thns", element: "thns", zooms: [4, 6, 8], legend: "thunder", page: "nowc" },
    tornado:   { ...NOWC, name: "竜巻発生確度", en: "Tornado likelihood", path: "surf/trns", element: "trns", legend: "tornado", page: "nowc" },

    "sat-ir":        { ...SAT, name: "ひまわり 赤外画像", en: "Himawari infrared", path: "B13/TBB", page: "himawari" },
    "sat-vis":       { ...SAT, name: "ひまわり 可視画像", en: "Himawari visible", path: "B03/ALBD", page: "himawari" },
    "sat-truecolor": { ...SAT, name: "ひまわり トゥルーカラー", en: "Himawari true color", path: "REP/ETC", page: "himawari" },

    rain1h:  { ...RASRF, name: "今後の雨 1時間降水量", en: "Rainfall forecast, 1 hour", path: "surf/rasrf", element: "rasrf", legend: "rain", page: "rasrf" },
    rain3h:  { ...RASRF, name: "今後の雨 3時間降水量", en: "Rainfall forecast, 3 hours", path: "surf/rasrf03h", element: "rasrf03h", page: "rasrf" },
    rain24h: { ...RASRF, name: "今後の雨 24時間降水量", en: "Rainfall forecast, 24 hours", path: "surf/rasrf24h", element: "rasrf24h", page: "rasrf" },

    weather:    { ...WDIST, name: "天気予報分布 天気", en: "Distribution forecast, weather", path: "surf/wm", element: "wm", legend: "weather", page: "wdist" },
    temp:       { ...WDIST, name: "天気予報分布 気温", en: "Distribution forecast, temperature", path: "surf/temp", element: "temp", legend: "temp", page: "wdist" },
    r3:         { ...WDIST, name: "天気予報分布 3時間降水量", en: "Distribution forecast, rainfall 3 hours", path: "surf/r3", element: "r3", legend: "rain3h", page: "wdist" },
    s3:         { ...WDIST, name: "天気予報分布 3時間降雪量", en: "Distribution forecast, snowfall 3 hours", path: "surf/s3", element: "s3", legend: "snow3h", page: "wdist" },
    "max-temp": { ...WDIST, name: "天気予報分布 日中の最高気温", en: "Distribution forecast, daytime high", path: "surf/max_temp", element: "max_temp", legend: "temp", page: "wdist" },
    "min-temp": { ...WDIST, name: "天気予報分布 朝の最低気温", en: "Distribution forecast, morning low", path: "surf/min_temp", element: "min_temp", legend: "temp", page: "wdist" },

    snowd:   { ...SNOW, name: "積雪の深さ", en: "Snow depth", path: "surf/snowd", page: "snow" },
    snow24h: { ...SNOW, name: "24時間降雪量", en: "Snowfall, 24 hours", path: "surf/snowf24h", page: "snow" },

    land:  { ...RISK, name: "キキクル 土砂災害", en: "Kikikuru, landslide risk", path: "surf/land", legend: "risk", page: "risk" },
    inund: { ...RISK, name: "キキクル 浸水害", en: "Kikikuru, inundation risk", path: "surf/inund", legend: "risk", page: "risk" }
  };

  // ---------- データ取得：気象庁 ----------
  async function loadJma(key) {
    const L2 = LAYERS[key];
    const bust = "?_=" + Date.now();
    const lists = await Promise.all(L2.times.map((f, i) =>
      fetch(`${JMA}${L2.dir}/${f}${bust}`)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .catch(e => { if (i === 0) throw e; return []; })   // 1つ目は必須、2つ目以降は無くても続行
    ));

    const seen = new Set();
    const list = [].concat(...lists)
      .filter(t => t.validtime && (!L2.element || t.elements?.includes(L2.element)))
      .filter(t => { const k = t.basetime + t.validtime; if (seen.has(k)) return false; seen.add(k); return true; })
      .map(t => ({ ...t, future: t.validtime > t.basetime }))
      .sort((a, b) => a.validtime.localeCompare(b.validtime) || a.basetime.localeCompare(b.basetime));

    const past = list.filter(t => !t.future).slice(-PAST_FRAMES);
    const future = list.filter(t => t.future).slice(0, PAST_FRAMES);
    if (!past.length && !future.length) throw new Error("時刻一覧が空です");

    const member = L2.member || "none";
    const ext = L2.ext || "png";
    return {
      source: "気象庁 " + L2.name,
      sourceEn: "Japan Meteorological Agency — " + L2.en,
      layerName: L2.name,
      layerNameEn: L2.en,
      attribution: `<a href="https://www.jma.go.jp/bosai/${L2.page}/" target="_blank">気象庁</a>`,
      legend: LEGENDS[L2.legend] || null,
      legendLink: `https://www.jma.go.jp/bosai/${L2.page}/`,
      list: [...past, ...future].map(t => ({
        time: parseJmaTime(t.validtime),
        future: t.future,
        url: `${JMA}${L2.dir}/${t.basetime}/${member}/${t.validtime}/${L2.path}/{z}/{x}/{y}.${ext}`
      })),
      zooms: L2.zooms
    };
  }

  // ---------- データ取得：RainViewer（予備） ----------
  async function loadRainViewer() {
    const r = await fetch("https://api.rainviewer.com/public/weather-maps.json?_=" + Date.now());
    if (!r.ok) throw new Error("RainViewer " + r.status);
    const j = await r.json();
    const past = (j.radar?.past || []).map(f => ({ ...f, future: false }));
    const now = (j.radar?.nowcast || []).map(f => ({ ...f, future: true }));
    if (!past.length) throw new Error("RainViewerデータが空です");
    return {
      source: 'RainViewer（予備）',
      sourceEn: 'RainViewer (fallback)',
      layerName: '雨雲の動き（RainViewer）',
      layerNameEn: 'Rain (RainViewer fallback)',
      attribution: '<a href="https://www.rainviewer.com/" target="_blank">RainViewer</a>',
      legend: LEGENDS.rain,
      list: [...past, ...now].map(f => ({
        time: new Date(f.time * 1000),
        future: f.future,
        url: `${j.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`
      })),
      zooms: range(1, 7)
    };
  }

  // ---------- 画像読み込み（キャッシュ付き） ----------
  const imgCache = new Map();
  let tileErrors = 0, tileOk = 0;


  function updateTileStatus() {
    // 範囲外の海域などは元から画像が無いことがあるため、失敗が目立つときだけ表示
    $("tileerr").textContent = tileErrors > 3 && tileErrors > tileOk * 0.3 ? TEXT.tileFail[lang](tileErrors) : "";
  }
  // 失敗したら間隔をあけて最大3回まで再試行
  function tryLoad(src, attempt = 0) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => {
        if (attempt >= 3) { rej(new Error("tile")); return; }
        setTimeout(() => tryLoad(src, attempt + 1).then(res, rej), 1500 * (attempt + 1));
      };
      img.src = attempt ? src + (src.includes("?") ? "&" : "?") + "r=" + attempt : src;
    });
  }
  function loadImg(src) {
    if (imgCache.has(src)) return imgCache.get(src);
    const p = tryLoad(src).then(img => { tileOk++; return img; }).catch(e => {
      imgCache.delete(src);
      tileErrors++; updateTileStatus();
      throw e;
    });
    imgCache.set(src, p);
    if (imgCache.size > 3000) imgCache.delete(imgCache.keys().next().value);
    return p;
  }

  // ---------- どのズームでも表示できる雨雲レイヤー ----------
  // 表示中のズームにタイルが無い場合は、近いズームのタイルを拡大・縮小して描く
  const RadarLayer = L.GridLayer.extend({
    initialize(url, zooms, options) {
      this._url = url;
      this._zooms = zooms;
      L.GridLayer.prototype.initialize.call(this, options);
    },
    _src(z, x, y) {
      return this._url.replace("{z}", z).replace("{x}", x).replace("{y}", y);
    },
    _nativeZoom(z) {
      if (this._zooms.includes(z)) return z;
      // 1段細かい画像があれば、それを縮小して使う（拡大よりきれい）
      if (this._zooms.includes(z + 1)) return z + 1;
      const below = this._zooms.filter(n => n <= z);
      if (below.length) return below[below.length - 1];
      return this._zooms[0];
    },
    createTile(coords, done) {
      const size = this.getTileSize();
      const canvas = document.createElement("canvas");
      canvas.width = size.x; canvas.height = size.y;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;

      const z = coords.z, n = this._nativeZoom(z);
      const count = 2 ** n;
      const wrapX = x => ((x % count) + count) % count;
      const finish = () => done(null, canvas);

      if (n <= z) {
        // 粗いタイルの一部を切り出して拡大
        const f = 2 ** (z - n);
        const px = Math.floor(coords.x / f), py = Math.floor(coords.y / f);
        if (py < 0 || py >= count) { setTimeout(finish); return canvas; }
        const sub = 256 / f;
        const sx = (coords.x - px * f) * sub, sy = (coords.y - py * f) * sub;
        loadImg(this._src(n, wrapX(px), py))
          .then(img => ctx.drawImage(img, sx, sy, sub, sub, 0, 0, size.x, size.y))
          .catch(() => {})
          .finally(finish);
      } else {
        // 細かいタイルを並べて縮小（最大4×4枚）
        const f = 2 ** Math.min(n - z, 2);
        const cell = size.x / f;
        const jobs = [];
        for (let i = 0; i < f; i++) for (let j = 0; j < f; j++) {
          const tx = coords.x * f + i, ty = coords.y * f + j;
          if (ty < 0 || ty >= count) continue;
          jobs.push(loadImg(this._src(n, wrapX(tx), ty))
            .then(img => ctx.drawImage(img, i * cell, j * cell, cell, cell))
            .catch(() => {}));
        }
        Promise.all(jobs).then(finish);
      }
      return canvas;
    }
  });

  // ---------- レイヤー構築 ----------
  let zooms = [];
  let attribution = "";

  async function buildFrames(data) {
    const keepTime = frames[current]?.time?.getTime();
    frames.forEach(f => f.layer && map.removeLayer(f.layer));

    zooms = data.zooms;
    tileErrors = 0; tileOk = 0; updateTileStatus();
    attribution = data.attribution;

    frames = data.list.map(f => ({ time: f.time, future: f.future, url: f.url, layer: null }));

    const lastPast = Math.max(0, frames.map(f => f.future).lastIndexOf(false));
    const same = keepTime ? frames.findIndex(f => f.time.getTime() === keepTime) : -1;
    current = follow || same < 0 ? lastPast : same;

    $("slider").max = frames.length - 1;
    lastData = data;
    renderSource();
    renderLegend(data.legend, data.legendLink);

    renderTrack(lastPast);
    show(current);
  }

  function layerFor(i) {
    const f = frames[i];
    if (!f.layer) {
      f.layer = new RadarLayer(f.url, zooms, {
        opacity: 0, zIndex: 10, attribution,
        updateWhenZooming: false, keepBuffer: 1
      });
    }
    return f.layer;
  }

  let lastData = null;    // 言語切り替え時の再描画用 / kept for redrawing on language switch
  let lastNowIdx = 0;

  function renderTrack(nowIdx) {
    lastNowIdx = nowIdx;
    const track = $("track");
    track.innerHTML = "";
    frames.forEach((f, i) => {
      const s = document.createElement("span");
      s.classList.add(f.future ? "future" : "past");
      if (i === nowIdx) s.classList.add("now");
      const tip = f.future ? T("fcTip") : T("obsTip");
      s.title = lang === "ja" ? `${fmt(f.time)}（${tip}）` : `${fmt(f.time)} (${tip})`;
      s.addEventListener("click", () => { manual(i); });
      track.appendChild(s);
    });
  }

  let lastUpdatedAt = null;
  function renderUpdated() {
    $("updated").textContent = lastUpdatedAt ? T("updated") + " " + fmt(lastUpdatedAt) : "";
  }

  function renderSource() {
    if (!lastData) return;
    $("source").textContent = T("dataIs") + ((lang === "ja" ? lastData.source : lastData.sourceEn) || lastData.source);
    $("layername").textContent = (lang === "ja" ? lastData.layerName : lastData.layerNameEn) || lastData.layerName;
  }

  function renderLegend(legend, link) {
    const el = $("legend");
    lastLegend = legend; lastLegendLink = link;
    const iso = typeof isoLegendHtml === "function" ? isoLegendHtml() : "";
    if (!legend) {
      // 色の意味を確認できていないデータは、気象庁の凡例へのリンクだけ出す
      el.style.display = link || iso ? "" : "none";
      el.innerHTML = (link ? `<a href="${link}" target="_blank" rel="noopener">${T("legendLink")}</a>` : "") + iso;
      return;
    }
    el.style.display = "";
    el.innerHTML = `<div class="unit">${legend.unit[lang]}${legend.approx ? T("approx") : ""}</div>` +
      legend.items.map(i => `<div><i style="background:${i[2]}"></i>${lang === "ja" ? i[0] : i[1]}</div>`).join("") + iso;
  }
  let lastLegend = null, lastLegendLink = "";

  function show(i) {
    if (!frames.length) return;
    current = (i + frames.length) % frames.length;
    // 地図に載せるのは表示中のコマと前後数コマだけ（拡大縮小時の読み込みを軽くする）
    const n = frames.length;
    const keep = new Set(playing ? [current, (current + 1) % n, (current + 2) % n] : [current]);
    keep.forEach(k => {
      const layer = layerFor(k);
      if (!map.hasLayer(layer)) layer.addTo(map);
      layer.setOpacity(k === current ? opacity : 0);
    });
    frames.forEach((f, k) => {
      if (!keep.has(k) && f.layer && map.hasLayer(f.layer)) map.removeLayer(f.layer);
    });
    const f = frames[current];
    $("time").textContent = fmtDate(f.time);
    $("kind").textContent = f.future ? T("forecast") : T("observed");
    $("kind").classList.toggle("future", f.future);
    $("slider").value = current;
    [...$("track").children].forEach((s, k) => s.classList.toggle("active", k === current));
    if (isoOn) drawIsobars();
  }

  // ---------- 再生 ----------
  const latestIndex = () => Math.max(0, frames.map(f => f.future).lastIndexOf(false));

  function setFollow(on) {
    follow = on;
    $("live").setAttribute("aria-pressed", String(on));
    if (on) { stop(); show(latestIndex()); }
  }
  // 手動でコマを動かしたら追従を解除
  function manual(i) { setFollow(false); stop(); show(i); }

  function play() {
    setFollow(false);
    playing = true;
    $("play").textContent = T("pause");
    playTimer = setInterval(() => show(current + 1), FRAME_MS);
  }
  function stop() {
    playing = false;
    $("play").textContent = T("play");
    clearInterval(playTimer);
  }

  // ---------- 等圧線 / isobars ----------
  // 海面気圧の格子データ(Open-Meteo)から4hPaごとの等圧線を描く。前線は描かない(自由に使えるデータがないため)
  const ISO = { lat0: 20, lat1: 50, lon0: 118, lon1: 156, step: 2, up: 8, maxAgeMs: 60 * 60 * 1000 };
  let isoOn = true, isoData = null, isoFetchedAt = 0, isoValid = null, isoLoading = null;
  map.createPane("isobars");
  map.getPane("isobars").style.zIndex = 450;
  map.getPane("isobars").style.pointerEvents = "none";
  const isoLayer = L.layerGroup().addTo(map);
  const ISO_ATTR = '<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0)';

  async function fetchIsobars() {
    const nx = Math.round((ISO.lon1 - ISO.lon0) / ISO.step) + 1;
    const ny = Math.round((ISO.lat1 - ISO.lat0) / ISO.step) + 1;
    const lats = [], lons = [];
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      lats.push(ISO.lat0 + j * ISO.step); lons.push(ISO.lon0 + i * ISO.step);
    }
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lats.join(",") +
      "&longitude=" + lons.join(",") +
      "&hourly=pressure_msl&past_days=1&forecast_days=3&timeformat=unixtime&timezone=GMT";
    const r = await fetch(url);
    if (!r.ok) throw new Error("Open-Meteo " + r.status);
    const j = await r.json();
    const pts = Array.isArray(j) ? j : [j];
    if (pts.length !== nx * ny) throw new Error("grid size mismatch");
    const times = pts[0].hourly.time.map(t => t * 1000);
    isoData = {
      nx, ny, times,
      grid: times.map((_, k) => pts.map(p => {
        const v = p.hourly.pressure_msl[k];
        return v == null ? NaN : v;
      }))
    };
    isoFetchedAt = Date.now();
  }

  function ensureIsobars() {
    if (isoData && Date.now() - isoFetchedAt < ISO.maxAgeMs) return Promise.resolve();
    if (!isoLoading) {
      isoLoading = fetchIsobars()
        .catch(e => { console.warn(e); $("error").textContent = T("isoFail"); })
        .finally(() => { isoLoading = null; });
    }
    return isoLoading;
  }

  // ---- 等圧線の計算(時刻ごとに結果を保存して、再生中は再計算しない) ----
  const isoCache = new Map();

  // Catmull-Rom 双三次補間で格子を細かくする(折れ線ではなく滑らかな面にする)
  function upsample(v, nx, ny, U) {
    const NX = (nx - 1) * U + 1, NY = (ny - 1) * U + 1;
    const at = (i, j) => v[Math.min(ny - 1, Math.max(0, j)) * nx + Math.min(nx - 1, Math.max(0, i))];
    const cr = (p0, p1, p2, p3, t) =>
      0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
    const g = new Float64Array(NX * NY);
    for (let J = 0; J < NY; J++) {
      const y = J / U, j0 = Math.min(Math.floor(y), ny - 2), ty = y - j0;
      for (let I = 0; I < NX; I++) {
        const x = I / U, i0 = Math.min(Math.floor(x), nx - 2), tx = x - i0;
        const rows = [-1, 0, 1, 2].map(dj => cr(at(i0 - 1, j0 + dj), at(i0, j0 + dj), at(i0 + 1, j0 + dj), at(i0 + 2, j0 + dj), tx));
        g[J * NX + I] = cr(rows[0], rows[1], rows[2], rows[3], ty);
      }
    }
    return { g, NX, NY };
  }

  // マーチングスクエア法で求めた線分を、辺を手がかりに1本の線につなぐ
  function contourLines(g, NX, NY, lv) {
    const pos = new Map(), adj = new Map();
    // 辺の交点(辺の両端は小さい番号→大きい番号の順で計算し、隣のマスと必ず同じ点になるようにする)
    const cross = (ia, ib) => {
      const key = ia < ib ? ia + "_" + ib : ib + "_" + ia;
      if (!pos.has(key)) {
        const lo = Math.min(ia, ib), hi = Math.max(ia, ib);
        const va = g[lo] - lv, vb = g[hi] - lv, f = va / (va - vb);
        const xa = lo % NX, ya = (lo - xa) / NX, xb = hi % NX, yb = (hi - xb) / NX;
        pos.set(key, [xa + (xb - xa) * f, ya + (yb - ya) * f]);
      }
      return key;
    };
    const link = (a, b) => {
      if (!adj.has(a)) adj.set(a, []);
      if (!adj.has(b)) adj.set(b, []);
      adj.get(a).push(b); adj.get(b).push(a);
    };
    for (let J = 0; J < NY - 1; J++) for (let I = 0; I < NX - 1; I++) {
      const c = [J * NX + I, J * NX + I + 1, (J + 1) * NX + I + 1, (J + 1) * NX + I];
      const p = c.map(k => g[k]);
      if (p.some(isNaN)) continue;
      const hit = [];
      for (let e = 0; e < 4; e++) {
        const a = c[e], b = c[(e + 1) % 4];
        if ((g[a] < lv) !== (g[b] < lv)) hit.push(cross(a, b));
      }
      if (hit.length === 2) link(hit[0], hit[1]);
      else if (hit.length === 4) {
        // 鞍点:マスの中心の値で、どちらの組み合わせでつなぐか決める
        const center = (p[0] + p[1] + p[2] + p[3]) / 4;
        if ((center < lv) === (p[0] < lv)) { link(hit[0], hit[3]); link(hit[1], hit[2]); }
        else { link(hit[0], hit[1]); link(hit[2], hit[3]); }
      }
    }
    // 端点(つながりが1つの点)から順にたどり、残りは閉じた輪としてたどる
    const used = new Set(), lines = [];
    const walk = (start) => {
      const line = [start]; used.add(start);
      let cur = start;
      for (;;) {
        const next = (adj.get(cur) || []).find(n => !used.has(n));
        if (!next) break;
        line.push(next); used.add(next); cur = next;
      }
      const closed = line.length > 2 && (adj.get(cur) || []).includes(start);
      lines.push({ pts: line.map(k => pos.get(k)), closed });
    };
    for (const [k, n] of adj) if (n.length === 1 && !used.has(k)) walk(k);
    for (const k of adj.keys()) if (!used.has(k)) walk(k);
    return lines;
  }

  // チャイキン法で角を丸める(閉じた線は継ぎ目も丸める)
  function smooth(pts, closed, iter = 2) {
    for (let t = 0; t < iter; t++) {
      if (pts.length < 3) return pts;
      const out = closed ? [] : [pts[0]];
      const n = pts.length, last = closed ? n : n - 1;
      for (let i = 0; i < last; i++) {
        const a = pts[i], b = pts[(i + 1) % n];
        out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
        out.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
      }
      if (!closed) out.push(pts[n - 1]);
      pts = out;
    }
    return pts;
  }

  function computeIsobars(k) {
    const key = isoFetchedAt + ":" + k;
    if (isoCache.has(key)) return isoCache.get(key);
    const { nx, ny } = isoData, v = isoData.grid[k];
    const U = ISO.up;
    const { g, NX, NY } = upsample(v, nx, ny, U);
    const toLL = ([x, y]) => [ISO.lat0 + (y / U) * ISO.step, ISO.lon0 + (x / U) * ISO.step];

    let min = Infinity, max = -Infinity;
    for (const x of g) if (!isNaN(x)) { if (x < min) min = x; if (x > max) max = x; }
    const thin = [], thick = [];
    if (isFinite(min)) {
      for (let lv = Math.ceil(min / 4) * 4; lv <= max; lv += 4) {
        const out = lv % 20 === 0 ? thick : thin;
        for (const ln of contourLines(g, NX, NY, lv)) {
          const pts = smooth(ln.pts, ln.closed).map(toLL);
          if (ln.closed) pts.push(pts[0]);
          out.push(pts);
        }
      }
    }

    // 高気圧・低気圧:粗い格子で見つけ、細かい格子で中心を正確に合わせる
    const R2 = 2, marks = [];
    for (let j = R2; j < ny - R2; j++) for (let i = R2; i < nx - R2; i++) {
      const c0 = v[j * nx + i];
      if (isNaN(c0)) continue;
      let isMax = true, isMin = true, sum = 0, n = 0;
      for (let dj = -R2; dj <= R2; dj++) for (let di = -R2; di <= R2; di++) {
        if (!di && !dj) continue;
        const w = v[(j + dj) * nx + (i + di)];
        if (isNaN(w)) { isMax = isMin = false; continue; }
        if (w > c0) isMax = false;
        if (w < c0) isMin = false;
        sum += w; n++;
      }
      if (!(isMax || isMin) || Math.abs(c0 - sum / n) < 1) continue;
      const kind = isMax ? "high" : "low";
      if (marks.some(q => q.kind === kind && Math.abs(q.i - i) <= R2 && Math.abs(q.j - j) <= R2)) continue;
      let bx = i * U, by = j * U, bv = g[by * NX + bx];
      for (let dy = -U; dy <= U; dy++) for (let dx = -U; dx <= U; dx++) {
        const X = i * U + dx, Y = j * U + dy, w = g[Y * NX + X];
        if (isNaN(w)) continue;
        if (isMax ? w > bv : w < bv) { bv = w; bx = X; by = Y; }
      }
      marks.push({ kind, i, j, ll: toLL([bx, by]), val: bv });
    }

    const res = { thin, thick, marks };
    isoCache.set(key, res);
    if (isoCache.size > 120) isoCache.delete(isoCache.keys().next().value);
    return res;
  }

  function drawIsobars() {
    isoLayer.clearLayers();
    isoValid = null;
    if (!isoOn || !isoData || !frames.length) { renderIsoInfo(); return; }

    // 表示中のコマに一番近い時刻の気圧を使う
    const t = frames[current].time.getTime();
    let k = 0, best = Infinity;
    isoData.times.forEach((tt, i) => { const d = Math.abs(tt - t); if (d < best) { best = d; k = i; } });
    isoValid = new Date(isoData.times[k]);
    const { thin, thick, marks } = computeIsobars(k);

    const opt = { pane: "isobars", interactive: false, lineCap: "round", lineJoin: "round", smoothFactor: 0.5 };
    // 下地の淡い線で、雨雲の上でも読めるようにする
    isoLayer.addLayer(L.polyline(thin, { ...opt, color: "#FFF3D6", weight: 3, opacity: 0.7 }));
    isoLayer.addLayer(L.polyline(thick, { ...opt, color: "#FFF3D6", weight: 4.5, opacity: 0.7 }));
    isoLayer.addLayer(L.polyline(thin, { ...opt, color: "#385723", weight: 1.2, opacity: 0.9 }));
    isoLayer.addLayer(L.polyline(thick, { ...opt, color: "#385723", weight: 2.4, opacity: 0.95 }));

    for (const m of marks) {
      L.marker(m.ll, {
        pane: "isobars", interactive: false, keyboard: false,
        icon: L.divIcon({ className: "hl " + m.kind, iconSize: [0, 0],
          html: `<div><b>${T(m.kind)}</b><span>${Math.round(m.val)}</span></div>` })
      }).addTo(isoLayer);
    }
    renderIsoInfo();
  }

  function renderIsoInfo() {
    $("isoinfo").textContent = isoOn && isoValid ? `${T("isoLabel")} ${fmtDate(isoValid)}` : "";
  }

  function isoLegendHtml() {
    if (!isoOn) return "";
    return `<div class="iso"><span class="unit">${T("isoLabel")}（hPa）</span>` +
      `<div><i class="thin"></i>${T("isoEvery")}</div>` +
      `<div><i></i>${T("isoThick")}</div>` +
      `<div><b>${T("high")}</b>／<b style="color:var(--volt-deep)">${T("low")}</b></div></div>`;
  }

  async function setIsobars(on) {
    isoOn = on;
    $("isobar").setAttribute("aria-pressed", String(on));
    try { localStorage.setItem("radar-iso", on ? "1" : "0"); } catch (e) { /* 保存できなくても動く */ }
    if (on) {
      map.attributionControl.addAttribution(ISO_ATTR);
      await ensureIsobars();
    } else {
      map.attributionControl.removeAttribution(ISO_ATTR);
    }
    renderLegend(lastLegend, lastLegendLink);
    drawIsobars();
  }
  $("isobar").addEventListener("click", () => setIsobars(!isoOn));

  // ---------- 天気図 / weather chart ----------
  const WMAP = "https://www.jma.go.jp/bosai/weather_map/data/";
  let wmList = null, wmFetchedAt = 0, wmKind = "now", wmArea = "near", wmIndex = -1, wmFile = "";
  const dlg = $("chart");

  async function loadChartList(force = false) {
    if (!force && wmList && Date.now() - wmFetchedAt < 60 * 1000) return;
    const r = await fetch(WMAP + "list.json?_=" + Date.now());
    if (!r.ok) throw new Error(r.status);
    const prevList = wmList;
    wmList = await r.json();
    wmFetchedAt = Date.now();
    // 最新の図を見ていたら最新へ、過去の図を見ていたら同じ図のまま / follow the newest only if it was shown
    const arr = wmList?.[wmArea]?.[wmKind] || [];
    const prevArr = prevList?.[wmArea]?.[wmKind] || [];
    const wasLatest = !prevList || wmIndex < 0 || wmIndex >= prevArr.length - 1;
    const keep = arr.indexOf(wmFile);
    wmIndex = wasLatest || keep < 0 ? -1 : keep;
    renderChartUpdated();
  }

  function renderChartUpdated() {
    $("chart-updated").textContent = wmFetchedAt ? `${T("updated")} ${fmt(new Date(wmFetchedAt))}` : "";
  }

  // 自動更新のたびに呼ぶ(窓を開いているときだけ) / called on every auto-refresh while open
  async function refreshChart() {
    if (!dlg.open) return;
    try { await loadChartList(true); renderChart(); }
    catch (e) { console.warn(e); }
  }

  function renderChart() {
    const arr = wmList?.[wmArea]?.[wmKind] || [];
    const img = $("chart-img");
    renderChartUpdated();
    dlg.querySelectorAll("[data-kind]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kind === wmKind)));
    dlg.querySelectorAll("[data-area]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.area === wmArea)));
    if (!arr.length) {
      $("chart-caption").textContent = T("chartNone");
      img.removeAttribute("src"); img.alt = T("chartNone");
      $("chart-prev").disabled = $("chart-next").disabled = true;
      return;
    }
    if (wmKind !== "now" || wmIndex < 0 || wmIndex >= arr.length) wmIndex = arr.length - 1;
    const file = arr[wmIndex];
    wmFile = file;
    const m = file.match(/_C_010000_(\d{14})_/);
    const base = m ? parseJmaTime(m[1]) : null;
    const hours = wmKind === "ft24" ? 24 : wmKind === "ft48" ? 48 : 0;
    let caption = "";
    if (base) {
      const valid = new Date(base.getTime() + hours * 3600 * 1000);
      caption = hours ? TEXT.chartFt[lang](fmtDate(valid), hours) : TEXT.chartNow[lang](fmtDate(valid));
    }
    $("chart-caption").textContent = caption;
    img.alt = TEXT.chartAlt[lang](wmArea === "near" ? T("areaNear") : T("areaAsia"), caption);
    img.src = WMAP + "png/" + file;
    $("chart-prev").disabled = wmKind !== "now" || wmIndex <= 0;
    $("chart-next").disabled = wmKind !== "now" || wmIndex >= arr.length - 1;
  }

  // 位置は画面内に収める / keep the window on screen
  function placeChart(x, y) {
    const w = dlg.offsetWidth, h = dlg.offsetHeight;
    x = Math.min(Math.max(0, x), Math.max(0, window.innerWidth - w));
    y = Math.min(Math.max(0, y), Math.max(0, window.innerHeight - Math.min(h, 60)));   // 見出しは必ず画面内に残す
    dlg.style.left = x + "px"; dlg.style.top = y + "px";
    try { localStorage.setItem("radar-chart-pos", JSON.stringify([x, y])); } catch (e) { /* 保存できなくても動く */ }
  }

  // ドラッグで移動 / drag by the header
  (() => {
    const handle = $("chart-handle");
    let sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
    handle.addEventListener("pointerdown", e => {
      if (e.target.closest("button")) return;
      dragging = true; handle.setPointerCapture(e.pointerId);
      const r = dlg.getBoundingClientRect();
      sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
      dlg.classList.add("dragging");
    });
    handle.addEventListener("pointermove", e => {
      if (dragging) placeChart(ox + e.clientX - sx, oy + e.clientY - sy);
    });
    const end = () => { dragging = false; dlg.classList.remove("dragging"); };
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
    // キーボードでも動かせる(操作の3原則) / keyboard move
    handle.addEventListener("keydown", e => {
      const step = e.shiftKey ? 50 : 10;
      const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
      if (!d) return;
      e.preventDefault();
      const r = dlg.getBoundingClientRect();
      placeChart(r.left + d[0], r.top + d[1]);
    });
    window.addEventListener("resize", () => {
      if (dlg.open) { const r = dlg.getBoundingClientRect(); placeChart(r.left, r.top); }
    });
  })();

  async function openChart() {
    if (!dlg.open) {
      dlg.show();                       // 地図を操作できるよう、画面をふさがない形で開く
      let pos = null;
      try { pos = JSON.parse(localStorage.getItem("radar-chart-pos")); } catch (e) { /* 既定の位置 */ }
      if (pos) placeChart(pos[0], pos[1]);
      else if (window.innerWidth < 520) placeChart(10, 10);
      else {
        // 初めて開くときは、操作パネルと凡例をふさがない右上に置く
        const lg = $("legend").getBoundingClientRect();
        let x = (lg.width ? lg.left : window.innerWidth) - dlg.offsetWidth - 10;
        if (x < 60) x = window.innerWidth - dlg.offsetWidth - 10;
        placeChart(x, 10);
      }
      $("chart-handle").focus();
    }
    try { await loadChartList(); }
    catch (e) { console.warn(e); }
    renderChart();
  }
  $("chartbtn").addEventListener("click", () => {
    if (dlg.open) { dlg.close(); return; }     // もう一度押すと閉じる
    openChart().then(() => $("chartbtn").setAttribute("aria-expanded", "true"));
  });
  $("chart-close").addEventListener("click", () => dlg.close());
  dlg.addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); dlg.close(); $("chartbtn").focus(); } });
  $("chartbtn").setAttribute("aria-expanded", "false");
  dlg.addEventListener("close", () => $("chartbtn").setAttribute("aria-expanded", "false"));
  dlg.querySelectorAll("[data-kind]").forEach(b => b.addEventListener("click", () => { wmKind = b.dataset.kind; wmIndex = -1; renderChart(); }));
  dlg.querySelectorAll("[data-area]").forEach(b => b.addEventListener("click", () => { wmArea = b.dataset.area; wmIndex = -1; renderChart(); }));
  $("chart-prev").addEventListener("click", () => { wmIndex--; renderChart(); });
  $("chart-next").addEventListener("click", () => { wmIndex++; renderChart(); });

  // ---------- 現在位置 / my position ----------
  // watchPositionで動きに追従する。位置は端末内でのみ使い、どこにも送らない
  let geoOn = false, geoWatch = null, geoMarker = null, geoCircle = null, geoLast = null;
  map.createPane("mypos");
  map.getPane("mypos").style.zIndex = 620;
  map.getPane("mypos").style.pointerEvents = "none";

  function renderGeoInfo() {
    if (!geoOn) { $("geoinfo").textContent = ""; return; }
    const acc = geoLast && geoLast.coords.accuracy;
    $("geoinfo").textContent = !geoLast ? T("geoWait")
      : acc >= 1 ? TEXT.geoAcc[lang](Math.round(acc))   // 誤差が分かるときだけ数値を添える
      : T("hereLabel");
  }

  function drawMyPosition(pan) {
    if (!geoLast) return;
    const ll = [geoLast.coords.latitude, geoLast.coords.longitude];
    const acc = geoLast.coords.accuracy || 0;
    if (!geoMarker) {
      geoCircle = L.circle(ll, { pane: "mypos", interactive: false, radius: acc,
        color: "#8C1B0D", weight: 1.5, opacity: 0.8, fillColor: "#B92613", fillOpacity: 0.1 }).addTo(map);
      geoMarker = L.marker(ll, { pane: "mypos", interactive: false, keyboard: false,
        icon: L.divIcon({ className: "me", iconSize: [0, 0], html: "" }) }).addTo(map);
    } else {
      geoMarker.setLatLng(ll);
      geoCircle.setLatLng(ll).setRadius(acc);
    }
    // 印には必ず文字を添える / the dot always carries a label
    geoMarker.getElement().innerHTML = `<div><i></i><span>${T("hereLabel")}</span></div>`;
    if (pan) map.setView(ll, Math.max(map.getZoom(), 10));
    renderGeoInfo();
  }

  function clearMyPosition() {
    if (geoMarker) { map.removeLayer(geoMarker); geoMarker = null; }
    if (geoCircle) { map.removeLayer(geoCircle); geoCircle = null; }
  }

  function setGeo(on, pan = true) {
    geoOn = on;
    $("geo").setAttribute("aria-pressed", String(on));
    try { localStorage.setItem("radar-geo", on ? "1" : "0"); } catch (e) { /* 保存できなくても動く */ }
    if (!on) {
      if (geoWatch !== null) { navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
      clearMyPosition();
      renderGeoInfo();
      return;
    }
    if (!navigator.geolocation) { $("error").textContent = T("noGeo"); setGeo(false); return; }
    renderGeoInfo();
    let first = pan;
    geoWatch = navigator.geolocation.watchPosition(
      pos => { geoLast = pos; drawMyPosition(first); first = false; $("error").textContent = ""; },
      err => {
        $("error").textContent = err.code === err.PERMISSION_DENIED ? T("geoDenied") : T("geoFail");
        if (err.code === err.PERMISSION_DENIED) setGeo(false);
      },
      { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
    );
  }
  $("geo").addEventListener("click", () => setGeo(!geoOn));

  // ---------- 自動更新 ----------
  async function refresh() {
    $("error").textContent = "";
    refreshChart();
    if (isoOn) ensureIsobars().then(drawIsobars);
    let data;
    const key = $("layer").value;
    try {
      data = await loadJma(key);
    } catch (e1) {
      console.warn("気象庁の取得に失敗:", e1);
      try {
        if (key !== "raincloud") throw e1;   // 予備データは雨雲だけ
        data = await loadRainViewer();
      } catch (e2) {
        console.error("RainViewerの取得にも失敗:", e2);
        $("error").textContent = T("failLoad");
        scheduleNext();
        return;
      }
    }
    await buildFrames(data);
    lastUpdatedAt = new Date();
    renderUpdated();
    scheduleNext();
  }

  function scheduleNext() {
    clearTimeout(refreshTimer);
    const sec = +$("interval").value;
    nextRefreshAt = Date.now() + sec * 1000;
    refreshTimer = setTimeout(refresh, sec * 1000);
  }

  function tickCountdown() {
    const s = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
    $("countdown").textContent = nextRefreshAt ? `${T("next")} ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : "";
  }

  // ---------- イベント ----------
  $("collapse").addEventListener("click", () => {
    const collapsed = $("panel").classList.toggle("collapsed");
    $("collapse").textContent = collapsed ? "▲" : "▼";
    $("collapse").setAttribute("aria-expanded", String(!collapsed));
    $("collapse").setAttribute("aria-label", collapsed ? T("expand") : T("collapse"));
  });
  $("settings").addEventListener("click", () => {
    const open = $("opts").hidden;
    $("opts").hidden = !open;
    $("settings").setAttribute("aria-pressed", String(open));
  });
  $("play").addEventListener("click", () => playing ? stop() : play());
  // ---------- 日英切り替え / language switch ----------
  function setLang(next) {
    lang = next;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-ja]").forEach(el => { el.textContent = el.dataset[lang]; });
    document.querySelectorAll("[data-ja-title]").forEach(el => { el.title = el.dataset[lang + "Title"]; });
    document.querySelectorAll("[data-ja-label]").forEach(el => {
      const v = el.dataset[lang + "Label"];
      if (el.tagName === "OPTGROUP") el.label = v; else el.setAttribute("aria-label", v);
    });
    $("play").textContent = playing ? T("pause") : T("play");
    $("collapse").setAttribute("aria-label", $("panel").classList.contains("collapsed") ? T("expand") : T("collapse"));
    renderSource();
    renderUpdated();
    renderLegend(lastLegend, lastLegendLink);
    if (isoOn) drawIsobars();
    if (geoOn) { if (geoLast) drawMyPosition(false); else renderGeoInfo(); }
    if (dlg.open) { renderChart(); renderChartUpdated(); }
    renderTrack(lastNowIdx);
    if (frames.length) show(current); else $("time").textContent = T("loading");
    try { localStorage.setItem("radar-lang", lang); } catch (e) { /* file:// では保存できないことがある */ }
  }
  $("lang").addEventListener("click", () => setLang(lang === "ja" ? "en" : "ja"));

  // 起動時の言語:前回の選択 → ブラウザの設定 → 日本語
  (() => {
    let start = null;
    try { start = localStorage.getItem("radar-lang"); } catch (e) { /* 読めなければ既定値 */ }
    if (!start) start = (navigator.language || "ja").toLowerCase().startsWith("ja") ? "ja" : "en";
    if (start === "en") setLang("en");
  })();

  $("live").addEventListener("click", () => setFollow(!follow));
  $("prev").addEventListener("click", () => { manual(current - 1); });
  $("next").addEventListener("click", () => { manual(current + 1); });
  $("slider").addEventListener("input", e => { manual(+e.target.value); });
  $("opacity").addEventListener("input", e => { opacity = +e.target.value; show(current); });
  $("interval").addEventListener("change", scheduleNext);
  $("layer").addEventListener("change", () => {
    frames.forEach(f => f.layer && map.removeLayer(f.layer));
    frames = [];
    imgCache.clear();
    $("time").textContent = T("loading");
    setFollow(true);
    refresh();
  });
  $("refresh").addEventListener("click", refresh);
  $("locate").addEventListener("click", () => {
    if (!geoOn) { setGeo(true); return; }                  // 表示が消えていれば、まず表示を入れる
    if (geoLast) drawMyPosition(true);
    else renderGeoInfo();
  });
  document.addEventListener("keydown", e => {
    if (!$("keys").checked) return;                       // 設定で無効にできる / can be switched off
    if (dlg.contains(e.target)) return;                    // 天気図の窓を操作中は、地図のショートカットを使わない
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "ArrowLeft") { manual(current - 1); }
    if (e.key === "ArrowRight") { manual(current + 1); }
    if (e.key === " ") { e.preventDefault(); playing ? stop() : play(); }
  });
  // タブが非表示から戻ったら即更新
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() > nextRefreshAt - 5000) refresh();
  });

  setInterval(tickCountdown, 1000);

  // 起動時:等圧線は既定で表示。現在地は前回の選択に従う(位置情報は勝手に取らない)
  (() => {
    let iso = null, geo = null;
    try { iso = localStorage.getItem("radar-iso"); geo = localStorage.getItem("radar-geo"); } catch (e) { /* 既定値 */ }
    setIsobars(iso !== "0");
    if (geo === "1") setGeo(true, false);
  })();

  refresh();
})();
</script>
</body>
</html>
